name: Deploy Production

# This workflow deliberately has no push trigger. GitHub's protected
# `production` Environment supplies the approval gate and its scoped secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

# Never allow two production deployments to overlap. A newer pending run can
# replace an older pending run, but never cancels an in-progress upload.
concurrency:
  group: bcoffense-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # This job deliberately does not reference the production Environment.
    # Its dependency install and full quality gate therefore cannot receive
    # production Cloudflare credentials.
    steps:
      - name: Check out dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install browser-test dependencies
        run: npm --prefix tests ci

      - name: Install Chromium
        run: npm --prefix tests exec -- playwright install --with-deps chromium

      - name: Run the canonical release-quality gate
        run: ./scripts/release-quality-gate.sh

  deploy:
    name: Deploy verified main to production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production

    steps:
      # Keep the dispatched SHA intact. The canonical deployment script then
      # fetches origin/main and refuses anything that is not its exact tip.
      - name: Check out dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install browser-test dependencies
        run: npm --prefix tests ci

      - name: Install Chromium
        run: npm --prefix tests exec -- playwright install --with-deps chromium

      - name: Confirm Cloudflare deployment credentials are configured
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            printf '%s\n' 'CLOUDFLARE_ACCOUNT_ID must be configured as a production environment secret.' >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            printf '%s\n' 'CLOUDFLARE_API_TOKEN must be configured as a production environment secret.' >&2
            exit 1
          fi

      # This script performs the exact-origin/main guard, the shared release
      # quality gate, the read-only D1 migration preflight, Pages deployment,
      # and final production-source verification.
      - name: Deploy through the guarded release script
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./scripts/deploy-cloudflare.sh

name: Deploy Notification Worker

# This Worker deploy is intentionally separate from the Pages release. The
# protected production environment supplies only the Worker-specific token.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bcoffense-notification-worker-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify notification Worker release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # This job intentionally has no production Environment or Cloudflare
    # credentials, so package install and release-quality testing are isolated.
    steps:
      - name: Check out dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install browser-test dependencies
        run: npm --prefix tests ci

      - name: Install Chromium and WebKit
        run: npm --prefix tests exec -- playwright install --with-deps chromium webkit

      - name: Run the canonical release-quality gate
        run: ./scripts/release-quality-gate.sh

  deploy:
    name: Deploy verified notification Worker to production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production

    steps:
      # Preserve the dispatched SHA. The guarded script independently verifies
      # that it is exactly the current tip of origin/main before deployment.
      - name: Check out dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      # Keep credentials off these dependency-install steps. The token is
      # scoped only to the two final guarded deployment steps below.
      - name: Install browser-test dependencies
        run: npm --prefix tests ci

      - name: Install Chromium and WebKit
        run: npm --prefix tests exec -- playwright install --with-deps chromium webkit

      - name: Confirm dedicated notification Worker credentials are configured
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_NOTIFICATION_WORKER_API_TOKEN: ${{ secrets.CLOUDFLARE_NOTIFICATION_WORKER_API_TOKEN }}
        run: |
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            printf '%s\n' 'CLOUDFLARE_ACCOUNT_ID must be configured as a production environment secret.' >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_NOTIFICATION_WORKER_API_TOKEN:-}" ]]; then
            printf '%s\n' 'CLOUDFLARE_NOTIFICATION_WORKER_API_TOKEN must be configured as a production environment secret.' >&2
            exit 1
          fi

      - name: Deploy through the guarded notification Worker script
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_NOTIFICATION_WORKER_API_TOKEN: ${{ secrets.CLOUDFLARE_NOTIFICATION_WORKER_API_TOKEN }}
        run: ./scripts/deploy-notification-worker.sh

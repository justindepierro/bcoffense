name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install browser-test dependencies
        run: npm --prefix tests ci
      - name: Install Chromium
        run: npm --prefix tests exec -- playwright install --with-deps chromium
      - name: Run release quality gate
        run: npm run release:quality
